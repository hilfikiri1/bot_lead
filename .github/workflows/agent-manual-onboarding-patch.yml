name: Apply manual onboarding integration patch

on:
  push:
    branches:
      - agent/manual-lead-onboarding-and-chat-context

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manual-lead-onboarding-and-chat-context
          fetch-depth: 0

      - name: Patch integration points
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise RuntimeError(f"Expected block not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          # Settings required for Meta webhook verification and Kommo external chat history.
          replace_once(
              "app/config.py",
              '''    whatsapp_phone_number_id: str = ""
              whatsapp_access_token: str = ""
              whatsapp_enabled: bool = False
          ''',
              '''    whatsapp_phone_number_id: str = ""
              whatsapp_access_token: str = ""
              whatsapp_verify_token: str = ""
              whatsapp_app_secret: str = ""
              whatsapp_enabled: bool = False
          ''',
          )
          replace_once(
              "app/config.py",
              '''    lead_status_sync_notify_only_on_differences: bool = True
          ''',
              '''    lead_status_sync_notify_only_on_differences: bool = True
              # Load Facebook/WhatsApp messages from Kommo into Telegram lead cards.
              # Requires the External chat history integration scope and an eligible plan.
              kommo_chat_context_enabled: bool = False
          ''',
          )

          # Mount the direct Meta WhatsApp webhook router.
          replace_once(
              "app/main.py",
              '''from app.api.telegram import router as telegram_router
          ''',
              '''from app.api.telegram import router as telegram_router
          from app.api.whatsapp import router as whatsapp_router
          ''',
          )
          replace_once(
              "app/main.py",
              '''app.include_router(telegram_router)
          app.include_router(admin_router)
          ''',
              '''app.include_router(telegram_router)
          app.include_router(whatsapp_router)
          app.include_router(admin_router)
          ''',
          )

          # Attach latest external chat context to the normal Kommo lead details.
          replace_once(
              "app/services/kommo_service.py",
              '''    pipeline_id = lead.get("pipeline_id")
              status_id = lead.get("status_id")
              return {
          ''',
              '''    chat_context = None
              if getattr(settings, "kommo_chat_context_enabled", False):
                  try:
                      from app.services import kommo_chat_service

                      chat_context = await kommo_chat_service.get_lead_chat_context(lead_id)
                  except Exception as exc:
                      logger.warning("Could not attach chat context for lead %s: %s", lead_id, exc)

              pipeline_id = lead.get("pipeline_id")
              status_id = lead.get("status_id")
              return {
          ''',
          )
          replace_once(
              "app/services/kommo_service.py",
              '''        "notes": notes,
                  "url": f"{_base_url()}/leads/detail/{lead_id}",
          ''',
              '''        "notes": notes,
                  "chat_context": chat_context,
                  "url": f"{_base_url()}/leads/detail/{lead_id}",
          ''',
          )

          # Show the latest Facebook/WhatsApp messages directly in Telegram lead cards.
          tools_path = Path("app/agent/tools.py")
          tools_text = tools_path.read_text()
          new_summary = r'''def format_lead_summary(lead: dict[str, Any]) -> str:
              contacts = lead.get("contacts") or []
              contact = contacts[0] if contacts else {}
              phones = ", ".join(str(x) for x in (contact.get("phones") or [])) or "—"
              emails = ", ".join(str(x) for x in (contact.get("emails") or [])) or "—"
              notes = lead.get("notes") or []
              last_note = str(notes[0].get("text") or "")[:1000] if notes else "—"
              internal = extract_internal_lead_number(lead) or lead.get("internal_lead_number")
              lines = [
                  f"<b>📌 {html.escape(str(lead.get('name') or lead.get('id') or 'Сделка'))}</b>",
                  "",
              ]
              if internal:
                  lines.append(f"Внутренний номер: <b>№{html.escape(str(internal))}</b>")
              else:
                  lines.append("Внутренний номер: не указан")
              lines.extend(
                  [
                      f"Kommo ID: <code>{html.escape(str(lead.get('id') or '—'))}</code>",
                      f"Воронка: {html.escape(str(lead.get('pipeline_name') or '—'))}",
                      f"Этап: {html.escape(str(lead.get('status_name') or '—'))}",
                      f"Бюджет: {html.escape(str(lead.get('price') or '—'))}",
                      f"Клиент: {html.escape(str(contact.get('name') or '—'))}",
                      f"Телефон: {html.escape(phones)}",
                      f"Email: {html.escape(emails)}",
                      "",
                      "<b>Последнее примечание</b>",
                      html.escape(last_note),
                  ]
              )

              chat = lead.get("chat_context") or {}
              if chat.get("enabled") and chat.get("available"):
                  messages = list(chat.get("messages") or [])
                  if messages:
                      lines.extend(["", f"<b>Последняя переписка · {html.escape(str(chat.get('origin') or 'чат'))}</b>"])
                      for item in messages[-6:]:
                          direction = "Клиент" if item.get("direction") == "incoming" else "Мы"
                          body = " ".join(str(item.get("text") or "[вложение]").split())
                          if len(body) > 320:
                              body = body[:317] + "…"
                          lines.append(f"<b>{direction}:</b> {html.escape(body)}")
                      analysis = chat.get("analysis") or {}
                      if analysis:
                          lines.extend(
                              [
                                  "",
                                  f"<b>Анализ:</b> {html.escape(str(analysis.get('summary') or '—'))}",
                                  f"<b>Следующий шаг:</b> {html.escape(str(analysis.get('recommended_action') or '—'))}",
                              ]
                          )
                  else:
                      lines.extend(["", "<b>Переписка:</b> беседы для сделки не найдены."])
              elif chat.get("enabled") and chat.get("reason") == "external_chat_history_scope_required":
                  lines.extend(
                      [
                          "",
                          "<b>Переписка:</b> Kommo видит беседу, но интеграции не выдано право "
                          "<code>External chat history</code>.",
                      ]
                  )

              if lead.get("url"):
                  lines.extend(
                      ["", f'<a href="{html.escape(str(lead["url"]), quote=True)}">Открыть в Kommo</a>']
                  )
              return "\n".join(lines)[:4000]
          '''
          pattern = r"def format_lead_summary\(lead: dict\[str, Any\]\) -> str:.*?\n\n\ndef lead_card_actions_markup"
          patched, count = re.subn(
              pattern,
              new_summary + "\n\n\ndef lead_card_actions_markup",
              tools_text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("Could not patch format_lead_summary")
          tools_path.write_text(patched)

          # Send one-tap iPhone vCards after the manager confirms onboarding.
          replace_once(
              "app/api/telegram.py",
              '''    await telegram_state_service.clear_state(user_id)
              await telegram_service.send_status_sync_result(chat_id, result)
          ''',
              '''    await telegram_state_service.clear_state(user_id)
              await telegram_service.send_status_sync_result(chat_id, result)
              for card in result.get("contact_cards") or []:
                  try:
                      client_name = str(card.get("name") or "Клиент").strip()
                      product = str(card.get("product") or "Новый запрос").strip()
                      lead_number = str(card.get("lead_number") or "").strip()
                      display_name = f"{client_name} — {product}"[:120]
                      content = client_message_service.build_vcard(
                          name=display_name,
                          company=f"B&BS · лид №{lead_number}" if lead_number else "B&BS",
                          phone=str(card.get("phone") or ""),
                          email=str(card.get("email") or "") or None,
                          language="pl",
                      )
                      await telegram_service.send_document(
                          chat_id,
                          filename=client_message_service.vcard_filename(display_name),
                          content=content,
                          caption=(
                              f"👤 <b>Контакт для iPhone · №{html.escape(lead_number)}</b>\n"
                              f"{html.escape(client_name)} — {html.escape(product)}\n"
                              "Нажмите на файл и выберите «Создать новый контакт»."
                          ),
                          mime_type="text/vcard",
                      )
                  except Exception as exc:
                      logger.warning("Could not send onboarding vCard: %s", exc)
          ''',
          )

          # Update confirmation/result wording for the new manual onboarding scope.
          replace_once(
              "app/services/telegram_service.py",
              '''            "⚠️ <b>ПОДТВЕРЖДЕНИЕ СИНХРОНИЗАЦИИ</b>\n\n"
                          f"Подготовлено действий: <b>{count}</b>.\n\n"
                          f"Google Sheets: только комментарии "
                          f"<code>{_esc(settings.google_sheets_comment_column)}</code> и номера "
                          f"<code>{_esc(settings.google_sheets_lead_number_column)}</code>.\n"
                          "Kommo: только названия надёжно сопоставленных сделок.\n\n"
                          f"Колонка <code>{_esc(settings.google_sheets_status_column)}</code> "
                          "со статусами SQL/MQL/Нецелевой <b>не изменяется</b>. "
                          "Перед записью бот повторно проверит оба источника."
          ''',
              '''            "⚠️ <b>ПОДТВЕРЖДЕНИЕ ОБРАБОТКИ НОВЫХ ЛИДОВ</b>\n\n"
                          f"Надёжно сопоставлено новых лидов: <b>{count}</b>.\n\n"
                          f"Google Sheets: будет заполнена только колонка номера "
                          f"<code>{_esc(settings.google_sheets_lead_number_column)}</code>.\n"
                          "Kommo: название, при необходимости этап «Первый контакт», "
                          "первичный анализ и задача на квалификацию.\n"
                          "Telegram: готовый контакт .vcf для iPhone.\n\n"
                          f"Колонки <code>{_esc(settings.google_sheets_status_column)}</code> и "
                          f"<code>{_esc(settings.google_sheets_comment_column)}</code> <b>не изменяются</b>. "
                          "Перед записью бот повторно проверит оба источника."
          ''',
          )
          replace_once(
              "app/services/telegram_service.py",
              '''    renamed_count = int(result.get("renamed_count") or 0)
              skipped = result.get("skipped") or []
              rename_skipped = result.get("rename_skipped") or []
          ''',
              '''    renamed_count = int(result.get("renamed_count") or 0)
              moved_count = int(result.get("status_moved_count") or 0)
              note_count = int(result.get("note_count") or 0)
              task_count = int(result.get("task_count") or 0)
              contact_count = len(result.get("contact_cards") or [])
              skipped = result.get("skipped") or []
              rename_skipped = result.get("rename_skipped") or []
          ''',
          )
          replace_once(
              "app/services/telegram_service.py",
              '''            "✅ <b>СИНХРОНИЗАЦИЯ ЗАВЕРШЕНА</b>\n\n"
                          f"Обновлено строк Google Sheets: <b>{updated_count}</b>\n"
                          f"Обновлено ячеек X/Y: <b>{updated_cells_count}</b>\n"
                          f"Переименовано сделок Kommo: <b>{renamed_count}</b>\n"
                          "Пропущено после повторной проверки: "
                          f"<b>{len(skipped) + len(rename_skipped)}</b>\n\n"
                          "Маркетинговые статусы W не изменялись."
          ''',
              '''            "✅ <b>НОВЫЕ ЛИДЫ ОБРАБОТАНЫ</b>\n\n"
                          f"Присвоено номеров Y: <b>{updated_count}</b>\n"
                          f"Обновлено ячеек: <b>{updated_cells_count}</b>\n"
                          f"Переименовано сделок Kommo: <b>{renamed_count}</b>\n"
                          f"Переведено на «Первый контакт»: <b>{moved_count}</b>\n"
                          f"Добавлено анализов: <b>{note_count}</b>\n"
                          f"Создано задач: <b>{task_count}</b>\n"
                          f"Подготовлено контактов iPhone: <b>{contact_count}</b>\n"
                          "Пропущено после повторной проверки: "
                          f"<b>{len(skipped) + len(rename_skipped)}</b>\n\n"
                          "Колонки W и X не изменялись."
          ''',
          )

          # Compatibility helpers retained for existing reporting tests and callers.
          sync_path = Path("app/services/lead_status_sync_service.py")
          sync_text = sync_path.read_text()
          sync_text = sync_text.replace(
              '_GENERIC_TITLES = {"товар", "новый товар"}\n_NOTE_CONCURRENCY = 8\n',
              '_GENERIC_TITLES = {"товар", "новый товар"}\n_MANAGED_COMMENT_PREFIX = "Клиент:"\n_COMMENT_LIMIT = 1200\n_NOTE_CONCURRENCY = 8\n',
              1,
          )
          marker = '''def _row_fingerprint(row: SpreadsheetRow) -> list[str]:
          '''
          compatibility = '''def _marketing_status_text(value: str | None) -> str:
              status = _clean(value)
              labels = {
                  "sql": "SQL — целевой B2B-лид",
                  "mql": "MQL — потенциально целевой, требуется квалификация",
                  "нецелевой": "Нецелевой",
                  "недозвон": "Недозвон",
                  "игнор": "Игнор / нет ответа",
                  "первый контакт": "Первый контакт",
                  "сделка / продажа": "Сделка / продажа",
              }
              return labels.get(status.casefold(), status or "пока не определена")


          def _manual_basis(comment: str | None) -> str:
              clean = _clean(comment)
              if not clean:
                  return ""
              if not clean.startswith(_MANAGED_COMMENT_PREFIX):
                  return clean[:600]
              match = re.search(
                  r"(?:^|\\. )Основание: (.*?)(?=\\. (?:Kommo|История):|$)",
                  clean,
              )
              return _clean(match.group(1))[:600] if match else ""


          def _note_excerpt(note: dict[str, Any]) -> str:
              text = _clean(note.get("text"))
              if not text:
                  return ""
              for note_marker in ("КРАТКОЕ РЕЗЮМЕ", "Краткое резюме:"):
                  if note_marker in text:
                      text = text.split(note_marker, 1)[1].strip(" :-")
                      break
              text = re.sub(r"\\s*(?:ПОЛНАЯ РАСШИФРОВКА|ЗАДАЧА|РИСКИ)\\b.*$", "", text)
              return _clean(text)[:220]


          def build_marketing_comment(
              row: SpreadsheetRow,
              lead: dict[str, Any],
              notes: list[dict[str, Any]],
          ) -> str:
              """Legacy read-only formatter retained for compatibility; onboarding never writes X."""
              parts = [
                  f"Клиент: {_clean(row.client_name) or 'не указан'}",
                  f"Запрос: {_clean(row.product) or _clean(lead.get('name')) or 'не указан'}",
              ]
              context = []
              if _clean(row.budget):
                  context.append(f"бюджет {_clean(row.budget)}")
              if _clean(row.contact_channel):
                  context.append(f"канал {_clean(row.contact_channel)}")
              if _clean(row.region):
                  context.append(f"регион {_clean(row.region)}")
              if context:
                  parts.append("Параметры: " + ", ".join(context))
              parts.append("Маркетинговая оценка: " + _marketing_status_text(row.lead_status))
              basis = _manual_basis(row.marketing_comment)
              if basis:
                  parts.append("Основание: " + basis)
              if _clean(lead.get("status_name")):
                  parts.append("Kommo: " + _clean(lead.get("status_name")))
              excerpts = []
              for note in reversed(list(notes[:4])):
                  excerpt = _note_excerpt(note)
                  if excerpt and excerpt.casefold() not in {item.casefold() for item in excerpts}:
                      excerpts.append(excerpt)
                  if len(excerpts) >= 4:
                      break
              if excerpts:
                  parts.append("История: " + " → ".join(excerpts))
              return (". ".join(part.rstrip(" .") for part in parts if part) + ".")[:_COMMENT_LIMIT].rstrip()


          '''
          if marker not in sync_text:
              raise RuntimeError("Could not locate sync helper insertion point")
          sync_text = sync_text.replace(marker, compatibility + marker, 1)
          sync_text = sync_text.replace(
              '''    for action in fresh_report.get("onboarding_actions") or []:
          ''',
              '''    actions = list(fresh_report.get("onboarding_actions") or [])
              if not actions and fresh_report.get("kommo_renames"):
                  # Compatibility path for a preview produced by the previous service version.
                  actions = [
                      {
                          **item,
                          "target_status_id": None,
                          "analysis_note": "",
                          "task_text": "",
                          "task_due_at": None,
                          "contact_card": {},
                      }
                      for item in fresh_report.get("kommo_renames") or []
                  ]

              for action in actions:
          ''',
              1,
          )
          sync_text = sync_text.replace(
              '''            marker = f"[BBS-ONBOARD-{action['lead_number']}-{lead_id}]"
                      recent_notes = await kommo_service.get_recent_common_notes(lead_id, limit=50)
                      if not any(marker in _clean(note.get("text")) for note in recent_notes):
                          await kommo_service.add_common_note(
                              lead_id, str(action.get("analysis_note") or "")
                          )
                          note_count += 1

                      tasks = await kommo_service.get_open_lead_tasks(lead_id, limit=50)
                      task_marker = f"№{action['lead_number']}"
                      if not any(task_marker in _clean(task.get("text")) for task in tasks):
                          await kommo_service.create_lead_task(
                              lead_id=lead_id,
                              text=str(action.get("task_text") or "Квалифицировать новый лид"),
                              complete_till=int(action.get("task_due_at") or _task_due_timestamp()),
                          )
                          task_count += 1
          ''',
              '''            if _clean(action.get("analysis_note")):
                          marker = f"[BBS-ONBOARD-{action['lead_number']}-{lead_id}]"
                          recent_notes = await kommo_service.get_recent_common_notes(lead_id, limit=50)
                          if not any(marker in _clean(note.get("text")) for note in recent_notes):
                              await kommo_service.add_common_note(
                                  lead_id, str(action.get("analysis_note") or "")
                              )
                              note_count += 1

                      if _clean(action.get("task_text")):
                          tasks = await kommo_service.get_open_lead_tasks(lead_id, limit=50)
                          task_marker = f"№{action['lead_number']}"
                          if not any(task_marker in _clean(task.get("text")) for task in tasks):
                              await kommo_service.create_lead_task(
                                  lead_id=lead_id,
                                  text=str(action.get("task_text")),
                                  complete_till=int(action.get("task_due_at") or _task_due_timestamp()),
                              )
                              task_count += 1
          ''',
              1,
          )
          sync_path.write_text(sync_text)

          env = Path(".env.example")
          env_text = env.read_text()
          additions = """
          # Direct Meta WhatsApp Cloud API webhook
          WHATSAPP_VERIFY_TOKEN=
          WHATSAPP_APP_SECRET=
          # Show Kommo Facebook/WhatsApp messages in Telegram lead cards.
          KOMMO_CHAT_CONTEXT_ENABLED=false
          """
          if "WHATSAPP_VERIFY_TOKEN=" not in env_text:
              env.write_text(env_text.rstrip() + "\n" + additions.lstrip())
          PY

      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_lead_status_sync.py \
            tests/test_manual_onboarding_and_chat_context.py

      - name: Commit patched integration points
        shell: bash
        run: |
          rm -f .github/workflows/agent-manual-onboarding-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect onboarding, vCards and chat context"
          git push origin HEAD:agent/manual-lead-onboarding-and-chat-context
