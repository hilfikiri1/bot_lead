name: Validate and finish manual onboarding integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finish:
    if: github.head_ref == 'agent/manual-lead-onboarding-and-chat-context'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract and run integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/agent-manual-onboarding-patch.yml').read_text()
          start_marker = "python - <<'PY'"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index("\n          PY", start)
          source = textwrap.dedent(workflow[start:end]).lstrip('\n')
          patch_file = Path('/tmp/apply_integration_patch.py')
          patch_file.write_text(source)
          subprocess.run(['python', str(patch_file)], check=True)
          PY

      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_lead_status_sync.py \
            tests/test_manual_onboarding_and_chat_context.py

      - name: Commit finished integration
        shell: bash
        run: |
          rm -f .github/workflows/agent-manual-onboarding-patch.yml
          rm -f .github/workflows/agent-manual-onboarding-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat: connect onboarding, vCards and chat context"
          git push origin HEAD:${{ github.head_ref }}
