name: Agent v3 CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "cursor/**"
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app migrations

      - name: Check Alembic heads
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $count"
            exit 1
          fi
          printf '%s\n' "$heads" | grep -q "007_unified_agent_v3"

      - name: Run pytest
        run: pytest -q
