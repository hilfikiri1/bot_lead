name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "cursor/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bytecode compile check
        run: python -m compileall -q app migrations

      - name: Alembic heads check
        run: |
          heads="$(python -m alembic heads)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $count"
            exit 1
          fi
          printf '%s\n' "$heads" | grep -q "012_supplier_offer_workspace"

      - name: Run tests
        run: pytest -q
