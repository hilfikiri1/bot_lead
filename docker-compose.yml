version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalog_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog_bot"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  bot:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - browser_session:/app/storage/browser
      - temporary_storage:/app/storage/temporary
      - output_storage:/app/storage/output
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  browser_session:
  temporary_storage:
  output_storage:
