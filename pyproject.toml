[project]
name = "babrik-1688-catalog-bot"
version = "0.1.0"
description = "Telegram bot that builds Babrik Solutions PDF catalogs from 1688 product pages"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.8.0",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "openai>=1.57.0",
  "pillow>=10.3.0",
  "playwright>=1.45.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy[asyncio]>=2.0.30",
  "structlog>=24.2.0",
  "tenacity>=8.3.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
