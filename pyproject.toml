[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "babrik-catalog-bot"
version = "1.0.0"
description = "Telegram bot that generates PDF product catalogs from 1688.com listings"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.13.1",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "playwright==1.49.0",
    "openai==1.57.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx==0.28.1",
    "jinja2==3.1.4",
    "pillow==11.0.0",
    "structlog==24.4.0",
    "python-multipart==0.0.20",
    "aiofiles==24.1.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
